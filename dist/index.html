<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111319"><meta name="description" content="BlueGay — an unofficial parody of BlueJ IDE. An independent, MIT-licensed desktop IDE."><title>BlueGay — Your space to code</title><link rel="icon" type="image/png" href="assets/bluegay-pride-logo.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="agent.css"><link rel="stylesheet" href="together.css"><link rel="stylesheet" href="previews.css"></head>
<body>
<div id="app">
 <header class="titlebar"><a class="brand" href="#" aria-label="BlueGay home"><img class="brand-mark" src="assets/bluegay-pride-logo.png" alt="">BlueGay</a><nav id="menus" aria-label="Application menu"></nav><button class="command-search" data-action="palette"><span>⌕</span><span>Search files and commands…</span><kbd>Ctrl K</kbd></button></header>
 <div class="workbench">
  <nav class="activity" aria-label="Sidebar"><button data-view="explorer" class="active" title="Explorer (Ctrl+Shift+E)" aria-label="Explorer"><svg viewBox="0 0 24 24"><path d="M8 3h9l4 4v13H8zM3 7v15h13M16 3v5h5"/></svg></button><button data-view="search" title="Search in workspace" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg></button><button data-view="changes" title="Local changes" aria-label="Local changes"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 7v10m12-9c0 7-12 2-12 8"/></svg></button><button data-view="outline" title="File outline" aria-label="Outline"><svg viewBox="0 0 24 24"><path d="M8 5h13M8 12h13M8 19h13M3 5h1M3 12h1M3 19h1"/></svg></button><button class="chat-activity" data-action="chatlgbt" title="ChatLGBT" aria-label="ChatLGBT">✦</button><button data-action="codeTogether" title="Code Together" aria-label="Code Together"><svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="3"/><circle cx="18" cy="8" r="2"/><path d="M2 20v-3a6 6 0 0 1 12 0v3m2-7a4 4 0 0 1 6 4v3M7 18l-2 2 2 2m4-4 2 2-2 2"/></svg></button><div class="activity-bottom"><button data-action="shortcuts" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">⌘</button><button data-action="preferences" title="Preferences" aria-label="Preferences"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></svg></button></div></nav>
  <aside class="sidebar" id="sidebar"><div class="sidebar-heading"><span id="sidebar-title">EXPLORER</span><div><button class="icon-button" data-action="newFile" title="New file">＋</button><button class="icon-button explorer-open-folder" data-action="openFolder" title="Open folder" aria-label="Open folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5.5A1.5 1.5 0 0 1 4.5 4H9l2 2h8.5A1.5 1.5 0 0 1 21 7.5V9M3 8h17.5a1 1 0 0 1 1 1.3l-2.3 9a1.5 1.5 0 0 1-1.5 1.2H5a1.5 1.5 0 0 1-1.5-1.3L2 9.2A1 1 0 0 1 3 8Z"/></svg></button></div></div><div id="sidebar-content"></div><div id="workspace-actions" class="workspace-actions"></div></aside>
  <main class="main"><div class="tabs-bar"><div id="tabs" role="tablist"></div><div class="tab-actions"><button class="icon-button" data-action="preview" title="Live preview / Preview file" aria-label="Preview file">▣</button><button class="icon-button" data-action="split" title="Split editor">◫</button><button class="icon-button" data-action="palette" title="More actions">···</button></div></div><div id="workspace"><div class="breadcrumb" id="breadcrumb"></div><div class="editor-area"><div id="editor"><div class="loading">Preparing your editor…</div></div><div id="split-editor" hidden></div></div><section class="bottom-panel" id="bottom-panel"><div class="panel-tabs"><button class="selected" data-panel="problems">PROBLEMS <span id="problem-count">0</span></button><button data-panel="history">FILE HISTORY</button><button data-panel="notes">SCRATCHPAD</button><button data-panel="debug">DEBUG CONSOLE</button><button data-panel="tests">JAVA TESTS</button><button class="close-panel" data-action="togglePanel" aria-label="Close panel">×</button></div><div id="panel-content"></div></section></div><div id="preferences" hidden></div></main>
 </div>
 <footer class="statusbar"><div><button data-action="changes" title="Local change tracking">⑂ <span id="project-status">starter-project</span></button><button data-action="togglePanel" title="Show problems">⊗ <span id="error-count">0</span> <span class="warning">△</span> <span id="warning-count">0</span></button><button class="save-indicator" data-action="reviewDisk" title="Review disk conflicts"><span class="local-dot"></span><span id="save-status">All changes saved</span></button></div><div><button id="position" data-action="gotoLine">Ln 1, Col 1</button><button id="indent-status" data-action="indent">Spaces: 2</button><span class="status-detail">UTF-8</span><button id="eol-status" data-action="eol">LF</button><button class="language-status" id="language-status" data-action="language">{ } TypeScript</button></div></footer>
</div>
<div id="popup" hidden></div><dialog id="modal"><div id="modal-content"></div></dialog><div id="toasts" role="status" aria-live="polite"></div><input id="file-input" type="file" multiple hidden><input id="folder-input" type="file" webkitdirectory multiple hidden><input id="zip-input" type="file" accept=".zip" hidden>
<script src="vendor/fflate.js"></script><script src="desktop-io.js"></script><script src="desktop.js"></script><script src="settings-client.js"></script><script src="boot.js"></script>
</body></html>
