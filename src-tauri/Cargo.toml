[package]
name = "bluegay"
version = "1.0.5"
description = "BlueGay desktop IDE - an unofficial parody of BlueJ IDE"
license = "MIT"
repository = "https://github.com/ReviveRC/BlueGay"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sha2 = "0.10"
getrandom = "0.3"
tempfile = "3"
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "net", "io-util", "time"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
base64 = "0.22.1"
jsonwebtoken = "9.3"
